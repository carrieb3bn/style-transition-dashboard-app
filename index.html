<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Three Bird Nest — Style Transition Dashboard</title>
<style>
  :root {
    --ink: #23201d;
    --paper: #faf7f2;
    --line: #e4ddd2;
    --vendor: #b5793a;
    --vendor-bg: #fbf0e2;
    --mfg: #2f6f66;
    --mfg-bg: #e9f3f1;
    --muted: #8a8378;
    --danger: #b3452f;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 32px 24px 80px; }
  .header {
    display: flex; justify-content: space-between; align-items: flex-end;
    flex-wrap: wrap; gap: 16px; margin-bottom: 24px;
    border-bottom: 1px solid var(--line); padding-bottom: 20px;
  }
  .header h1 { font-size: 22px; letter-spacing: -0.01em; margin: 0 0 4px; }
  .header p { margin: 0; color: var(--muted); font-size: 13px; }
  .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .controls label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
  .controls input {
    border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px;
    font-size: 13px; background: #fff;
  }
  .btn {
    background: var(--ink); color: var(--paper); border: none; border-radius: 6px;
    padding: 9px 16px; font-size: 13px; cursor: pointer; align-self: flex-end;
  }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 28px; }
  .summaryCard { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .summaryCard .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin-bottom: 6px; }
  .summaryCard .value { font-size: 20px; font-weight: 600; }
  .pairCard { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 16px; overflow: hidden; }
  .pairHead { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: baseline; }
  .pairHead .styleKey { font-size: 12px; color: var(--muted); letter-spacing: 0.02em; }
  .pairBody { display: grid; grid-template-columns: 1fr 1fr; }
  .side { padding: 16px; }
  .side + .side { border-left: 1px solid var(--line); }
  .side.vendor { background: var(--vendor-bg); }
  .side.manufacturing { background: var(--mfg-bg); }
  .side .tag {
    display: inline-block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em;
    font-weight: 700; padding: 2px 7px; border-radius: 4px; margin-bottom: 8px;
  }
  .side.vendor .tag { background: var(--vendor); color: #fff; }
  .side.manufacturing .tag { background: var(--mfg); color: #fff; }
  .side .missing { color: var(--muted); font-size: 13px; font-style: italic; }
  .side .title { font-weight: 600; font-size: 14px; margin: 0 0 10px; }
  .metrics { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px 16px; }
  .metric .label { font-size: 11px; color: var(--muted); }
  .metric .value { font-size: 15px; font-weight: 600; }
  .statusPill {
    font-size: 10px; padding: 2px 6px; border-radius: 4px; margin-left: 8px;
    background: var(--line); color: var(--ink); text-transform: uppercase;
  }
  .error { background: #fbe9e5; border: 1px solid var(--danger); color: var(--danger); padding: 12px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 20px; }
  .pendingNote { background: #fdf3e3; border: 1px solid #d9a441; color: #7a5a13; padding: 10px 12px; border-radius: 8px; font-size: 12px; margin-top: 8px; }
  .loading { color: var(--muted); font-size: 13px; }
  .empty { color: var(--muted); font-size: 13px; padding: 40px 0; text-align: center; }
  .sideTop { display: flex; gap: 12px; margin-bottom: 12px; }
  .thumb { width: 56px; height: 56px; border-radius: 6px; object-fit: cover; flex-shrink: 0; border: 1px solid var(--line); background: #fff; }
  .thumbEmpty { display: flex; align-items: center; justify-content: center; font-size: 9px; color: var(--muted); text-align: center; }
  .idLine { font-size: 11px; color: var(--muted); margin: 0; }
  .idLine a { color: inherit; text-decoration: underline; }
  .metric.wide { grid-column: span 2; }
  .pending { font-size: 11px; color: var(--muted); font-style: italic; }
  .readyBadge {
    display: inline-block; background: #2f6f2f; color: #fff; font-size: 10px;
    font-weight: 700; letter-spacing: 0.03em; padding: 2px 8px; border-radius: 4px;
    margin-left: 8px; vertical-align: middle;
  }
  .combinePanel { border-top: 1px solid var(--line); background: #f5f1e8; padding: 14px 16px; }
  .combineHead { font-size: 12px; font-weight: 700; margin-bottom: 6px; }
  .heuristicTag {
    font-size: 10px; font-weight: 400; font-style: italic; color: var(--muted);
    margin-left: 6px; text-transform: none;
  }
  .combineRec { font-size: 13px; margin: 0 0 6px; }
  .combineRec a { color: var(--ink); }
  .combineReason { font-size: 12px; color: var(--muted); margin: 0 0 10px; line-height: 1.5; }
  .combineStats { display: flex; gap: 16px; flex-wrap: wrap; font-size: 11px; color: var(--muted); }
  .skuTable { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 11px; }
  .skuTable th { text-align: left; color: var(--muted); font-weight: 600; padding: 4px 6px; border-bottom: 1px solid var(--line); text-transform: uppercase; letter-spacing: 0.03em; font-size: 10px; }
  .skuTable td { padding: 4px 6px; border-bottom: 1px solid rgba(0,0,0,0.05); }
  .skuTable tr:last-child td { border-bottom: none; }
  .skuOut { color: var(--danger); font-weight: 600; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div>
        <h1>Three Bird Nest — Style Transition Dashboard</h1>
        <p id="subhead">Vendor vs. manufacturing sales by style, paired on shared <code>style:</code> tags, matched by SKU.</p>
      </div>
      <div class="controls">
        <div>
          <label>Start date</label>
          <input type="date" id="startDate" />
        </div>
        <div>
          <label>End date</label>
          <input type="date" id="endDate" />
        </div>
        <button class="btn" id="refreshBtn">Refresh</button>
      </div>
    </div>

    <div id="errorBox"></div>
    <div class="summary" id="summary"></div>
    <div id="pairsContainer"></div>
  </div>

  <script>
    function isoDaysAgo(n) {
      const d = new Date();
      d.setDate(d.getDate() - n);
      return d.toISOString().slice(0, 10);
    }

    function money(n) {
      return "$" + (n || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function pct(n) {
      return Math.round((n || 0) * 100) + "%";
    }

    function sellThrough(units, inventory) {
      const denom = units + Math.max(inventory, 0);
      if (denom === 0) return 0;
      return units / denom;
    }

    function daysSince(dateStr) {
      return Math.floor((Date.now() - new Date(dateStr).getTime()) / 86400000);
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    // Sums per-SKU sales/returns up to the product level. Order counts are
    // unioned (not summed) across SKUs so AOV reflects distinct orders, not
    // double-counted ones when a single order contains two sizes.
    function aggregateProduct(entry, salesBySku, returnsBySku) {
      let units = 0, revenue = 0, returnedUnits = 0;
      const orderIdSet = new Set();

      for (const v of entry.variants) {
        const s = salesBySku[v.sku];
        if (s) {
          units += s.units;
          revenue += s.revenue;
          for (const oid of s.orderIds) orderIdSet.add(oid);
        }
        const r = returnsBySku[v.sku];
        if (r) returnedUnits += r.returnedUnits;
      }

      const orderCount = orderIdSet.size;
      return {
        units,
        revenue: Math.round(revenue * 100) / 100,
        aov: orderCount > 0 ? Math.round((revenue / orderCount) * 100) / 100 : 0,
        returnedUnits,
      };
    }

    function isReadyToCombine(pair) {
      return !!(pair.vendor && pair.manufacturing && pair.vendor.totalInventory <= 0);
    }

    // Heuristic only — based on product age (proxy for accumulated search
    // equity) and current sales/return performance. This is NOT real SEO
    // data (no backlinks, rankings, or organic traffic here). Always
    // sanity-check against Google Search Console before actually
    // redirecting a URL.
    function buildSeoSuggestion(vendorAgg, mfgAgg, vendorAge, mfgAge) {
      let recommended, reasoning;

      if (vendorAge > mfgAge * 1.5 && vendorAge > 60) {
        recommended = "vendor";
        reasoning = "The vendor page is substantially older (" + vendorAge + " days vs " + mfgAge +
          " days), so it likely carries more accumulated search equity. Suggest keeping the vendor URL live, moving the manufacturing product's content onto it, and redirecting the manufacturing URL into it.";
      } else if (mfgAgg.revenue > vendorAgg.revenue * 1.5 && mfgAgg.units > 0) {
        recommended = "manufacturing";
        reasoning = "The manufacturing page is already outperforming on revenue (" + money(mfgAgg.revenue) +
          " vs " + money(vendorAgg.revenue) + ") despite being newer. Current demand outweighs the smaller age gap here.";
      } else {
        recommended = vendorAge >= mfgAge ? "vendor" : "manufacturing";
        reasoning = "Too close to call from age and sales alone \u2014 defaulting to the older URL as the safer SEO default. Confirm with Google Search Console (organic clicks/impressions per URL) before finalizing.";
      }

      return { recommended, reasoning };
    }

    function renderCombineSuggestion(pair, vendorAgg, mfgAgg) {
      const vendorAge = daysSince(pair.vendor.createdAt);
      const mfgAge = daysSince(pair.manufacturing.createdAt);
      const vendorReturnRate = vendorAgg.units > 0 ? vendorAgg.returnedUnits / vendorAgg.units : 0;
      const mfgReturnRate = mfgAgg.units > 0 ? mfgAgg.returnedUnits / mfgAgg.units : 0;
      const s = buildSeoSuggestion(vendorAgg, mfgAgg, vendorAge, mfgAge);
      const winnerEntry = s.recommended === "vendor" ? pair.vendor : pair.manufacturing;

      return (
        '<div class="combinePanel">' +
          '<div class="combineHead">SEO merge suggestion <span class="heuristicTag">heuristic, not verified SEO data</span></div>' +
          '<p class="combineRec">Suggested keeper: <strong>' + (s.recommended === "vendor" ? "Vendor URL" : "Manufacturing URL") +
            '</strong> \u2014 <a href="' + escapeHtml(winnerEntry.url) + '" target="_blank" rel="noopener">' + escapeHtml(winnerEntry.url) + '</a></p>' +
          '<p class="combineReason">' + escapeHtml(s.reasoning) + '</p>' +
          '<div class="combineStats">' +
            '<span>Vendor age: ' + vendorAge + 'd</span>' +
            '<span>Manufacturing age: ' + mfgAge + 'd</span>' +
            '<span>Vendor return rate: ' + pct(vendorReturnRate) + '</span>' +
            '<span>Manufacturing return rate: ' + pct(mfgReturnRate) + '</span>' +
          '</div>' +
        '</div>'
      );
    }

    function renderSkuTable(entry, salesBySku, returnsBySku) {
      if (!entry.variants || entry.variants.length === 0) return "";

      const rows = entry.variants.map(function (v) {
        const s = salesBySku[v.sku] || { units: 0, revenue: 0 };
        const r = returnsBySku[v.sku] || { returnedUnits: 0 };
        const invClass = v.inventory <= 0 ? "skuOut" : "";
        return (
          '<tr>' +
            '<td>' + escapeHtml(v.size) + '</td>' +
            '<td>' + escapeHtml(v.sku) + '</td>' +
            '<td>' + s.units + '</td>' +
            '<td>' + money(s.revenue) + '</td>' +
            '<td>' + r.returnedUnits + '</td>' +
            '<td class="' + invClass + '">' + v.inventory + '</td>' +
          '</tr>'
        );
      }).join("");

      return (
        '<table class="skuTable">' +
          '<thead><tr><th>Size</th><th>SKU</th><th>Units</th><th>Revenue</th><th>Returned</th><th>Inv.</th></tr></thead>' +
          '<tbody>' + rows + '</tbody>' +
        '</table>'
      );
    }

    function renderSide(label, entry, agg, sessionsInfo, salesBySku, returnsBySku) {
      if (!entry) {
        return (
          '<div class="side">' +
            '<span class="tag">—</span>' +
            '<p class="missing">No ' + label.toLowerCase() + ' product tagged for this style.</p>' +
          '</div>'
        );
      }

      const a = agg || { units: 0, revenue: 0, aov: 0, returnedUnits: 0 };
      const st = sellThrough(a.units, entry.totalInventory);
      const returnRate = a.units > 0 ? a.returnedUnits / a.units : 0;
      const imageHtml = entry.image
        ? '<img src="' + escapeHtml(entry.image) + '" alt="" class="thumb" />'
        : '<div class="thumb thumbEmpty">No image</div>';

      let sessionsBlock;
      if (!sessionsInfo) {
        sessionsBlock =
          '<div class="metric"><div class="label">Sessions</div><div class="value">—</div></div>' +
          '<div class="metric"><div class="label">Conv. rate</div><div class="value">—</div></div>';
      } else if (!sessionsInfo.available) {
        sessionsBlock =
          '<div class="metric wide"><div class="label">Sessions / Conv. rate</div>' +
          '<div class="pending">Pending Shopify approval (read_reports + protected data)</div></div>';
      } else {
        const info = sessionsInfo.sessions[entry.handle];
        sessionsBlock =
          '<div class="metric"><div class="label">Sessions</div><div class="value">' + (info ? info.sessions : 0) + '</div></div>' +
          '<div class="metric"><div class="label">Conv. rate</div><div class="value">' + (info ? pct(info.conversionRate) : "0%") + '</div></div>';
      }

      return (
        '<div class="side ' + label.toLowerCase() + '">' +
          '<div class="sideTop">' +
            imageHtml +
            '<div>' +
              '<span class="tag">' + label + '</span>' +
              '<p class="title">' + escapeHtml(entry.title) +
                '<span class="statusPill">' + escapeHtml(entry.status) + '</span>' +
              '</p>' +
              '<p class="idLine">ID ' + escapeHtml(entry.numericId) +
                ' &middot; <a href="' + escapeHtml(entry.url) + '" target="_blank" rel="noopener">View</a>' +
                ' &middot; <a href="' + escapeHtml(entry.adminUrl) + '" target="_blank" rel="noopener">Edit</a>' +
              '</p>' +
            '</div>' +
          '</div>' +
          '<div class="metrics">' +
            '<div class="metric"><div class="label">Units sold</div><div class="value">' + a.units + '</div></div>' +
            '<div class="metric"><div class="label">Revenue</div><div class="value">' + money(a.revenue) + '</div></div>' +
            '<div class="metric"><div class="label">AOV</div><div class="value">' + money(a.aov) + '</div></div>' +
            '<div class="metric"><div class="label">Inventory left</div><div class="value">' + entry.totalInventory + '</div></div>' +
            '<div class="metric"><div class="label">Sell-through</div><div class="value">' + pct(st) + '</div></div>' +
            '<div class="metric"><div class="label">Returned units</div><div class="value">' + a.returnedUnits + '</div></div>' +
            '<div class="metric"><div class="label">Return rate</div><div class="value">' + pct(returnRate) + '</div></div>' +
            sessionsBlock +
          '</div>' +
          renderSkuTable(entry, salesBySku, returnsBySku) +
        '</div>'
      );
    }

    async function loadEverything() {
      const startDate = document.getElementById("startDate").value;
      const endDate = document.getElementById("endDate").value;
      const refreshBtn = document.getElementById("refreshBtn");
      const errorBox = document.getElementById("errorBox");
      const summary = document.getElementById("summary");
      const pairsContainer = document.getElementById("pairsContainer");
      const subhead = document.getElementById("subhead");

      refreshBtn.disabled = true;
      refreshBtn.textContent = "Loading…";
      errorBox.innerHTML = "";
      pairsContainer.innerHTML = '<p class="loading">Loading style pairs…</p>';

      try {
        const pairsRes = await fetch("/api/pairs");
        const pairsJson = await pairsRes.json();
        if (!pairsRes.ok) throw new Error(pairsJson.error || "Failed to load products");

        const pairs = pairsJson.pairs;

        // Collect every SKU across every tracked product
        const allSkus = [];
        for (const p of pairs) {
          if (p.vendor) for (const v of p.vendor.variants) allSkus.push(v.sku);
          if (p.manufacturing) for (const v of p.manufacturing.variants) allSkus.push(v.sku);
        }

        let salesBySku = {};
        let returnsBySku = {};
        let meta = null;
        let sessionsResult = null;

        if (allSkus.length > 0) {
          const salesRes = await fetch("/api/sales", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ skus: allSkus, startDate, endDate }),
          });
          const salesJson = await salesRes.json();
          if (!salesRes.ok) throw new Error(salesJson.error || "Failed to load sales");
          salesBySku = salesJson.sales;
          meta = { ordersScanned: salesJson.ordersScanned, partial: salesJson.partial };

          const returnsRes = await fetch("/api/returns", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ skus: allSkus, startDate, endDate }),
          });
          const returnsJson = await returnsRes.json();
          if (returnsRes.ok) returnsBySku = returnsJson.returns;

          const handles = [];
          for (const p of pairs) {
            if (p.vendor) handles.push(p.vendor.handle);
            if (p.manufacturing) handles.push(p.manufacturing.handle);
          }

          const sessionsRes = await fetch("/api/sessions", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ handles, startDate, endDate }),
          });
          sessionsResult = await sessionsRes.json();
        }

        // Aggregate per-product totals from per-SKU data, and running totals
        let vUnits = 0, vRev = 0, mUnits = 0, mRev = 0;
        const productAggs = {}; // productId -> agg

        for (const p of pairs) {
          if (p.vendor) {
            const agg = aggregateProduct(p.vendor, salesBySku, returnsBySku);
            productAggs[p.vendor.id] = agg;
            vUnits += agg.units;
            vRev += agg.revenue;
          }
          if (p.manufacturing) {
            const agg = aggregateProduct(p.manufacturing, salesBySku, returnsBySku);
            productAggs[p.manufacturing.id] = agg;
            mUnits += agg.units;
            mRev += agg.revenue;
          }
        }

        summary.innerHTML =
          '<div class="summaryCard"><div class="label">Vendor units</div><div class="value">' + vUnits + '</div></div>' +
          '<div class="summaryCard"><div class="label">Vendor revenue</div><div class="value">' + money(vRev) + '</div></div>' +
          '<div class="summaryCard"><div class="label">Manufacturing units</div><div class="value">' + mUnits + '</div></div>' +
          '<div class="summaryCard"><div class="label">Manufacturing revenue</div><div class="value">' + money(mRev) + '</div></div>';

        if (meta && meta.ordersScanned != null) {
          subhead.innerHTML = 'Vendor vs. manufacturing sales by style, paired on shared <code>style:</code> tags, matched by SKU. &middot; ' +
            meta.ordersScanned + ' orders scanned' + (meta.partial ? ' (partial — narrow the date range)' : '');
        }

        if (sessionsResult && !sessionsResult.available) {
          const note = document.createElement("div");
          note.className = "pendingNote";
          note.textContent = "Sessions/conversion rate not yet available: " + sessionsResult.reason;
          errorBox.appendChild(note);
        }

        if (pairs.length === 0) {
          pairsContainer.innerHTML = '<div class="empty">No paired products found. Make sure products carry both a shared ' +
            '<code>style:&lt;key&gt;</code> tag and a <code>source:vendor</code> or <code>source:manufacturing</code> tag.</div>';
        } else {
          pairsContainer.innerHTML = pairs.map(function (p) {
            const readyFlag = isReadyToCombine(p);
            const vendorAgg = p.vendor ? productAggs[p.vendor.id] : null;
            const mfgAgg = p.manufacturing ? productAggs[p.manufacturing.id] : null;

            return (
              '<div class="pairCard">' +
                '<div class="pairHead">' +
                  '<span>' +
                    '<strong>' + escapeHtml(p.styleKey) + '</strong>' +
                    (readyFlag ? ' <span class="readyBadge">READY TO COMBINE</span>' : '') +
                  '</span>' +
                  '<span class="styleKey">style:' + escapeHtml(p.styleKey) + '</span>' +
                '</div>' +
                '<div class="pairBody">' +
                  renderSide("Vendor", p.vendor, vendorAgg, sessionsResult, salesBySku, returnsBySku) +
                  renderSide("Manufacturing", p.manufacturing, mfgAgg, sessionsResult, salesBySku, returnsBySku) +
                '</div>' +
                (readyFlag ? renderCombineSuggestion(p, vendorAgg, mfgAgg) : '') +
              '</div>'
            );
          }).join("");
        }
      } catch (err) {
        errorBox.innerHTML = '<div class="error">' + escapeHtml(err.message) + '</div>';
        pairsContainer.innerHTML = "";
      } finally {
        refreshBtn.disabled = false;
        refreshBtn.textContent = "Refresh";
      }
    }

    document.getElementById("startDate").value = isoDaysAgo(90);
    document.getElementById("endDate").value = isoDaysAgo(0);
    document.getElementById("refreshBtn").addEventListener("click", loadEverything);

    loadEverything();
  </script>
</body>
</html>
