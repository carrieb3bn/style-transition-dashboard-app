<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Style Transition Dashboard</title>
<style>
  :root {
    --ink: #23201d;
    --paper: #faf7f2;
    --line: #e4ddd2;
    --vendor: #b5793a;
    --vendor-bg: #fbf0e2;
    --mfg: #2f6f66;
    --mfg-bg: #e9f3f1;
    --muted: #8a8378;
    --danger: #b3452f;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 32px 24px 80px; }
  .header {
    display: flex; justify-content: space-between; align-items: flex-end;
    flex-wrap: wrap; gap: 16px; margin-bottom: 24px;
    border-bottom: 1px solid var(--line); padding-bottom: 20px;
  }
  .header h1 { font-size: 22px; letter-spacing: -0.01em; margin: 0 0 4px; }
  .header p { margin: 0; color: var(--muted); font-size: 13px; }
  .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .controls label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
  .controls input {
    border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px;
    font-size: 13px; background: #fff;
  }
  .btn {
    background: var(--ink); color: var(--paper); border: none; border-radius: 6px;
    padding: 9px 16px; font-size: 13px; cursor: pointer; align-self: flex-end;
  }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 28px; }
  .summaryCard { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .summaryCard .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin-bottom: 6px; }
  .summaryCard .value { font-size: 20px; font-weight: 600; }
  .pairCard { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 16px; overflow: hidden; }
  .pairHead { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: baseline; }
  .pairHead .styleKey { font-size: 12px; color: var(--muted); letter-spacing: 0.02em; }
  .pairBody { display: grid; grid-template-columns: 1fr 1fr; }
  .side { padding: 16px; }
  .side + .side { border-left: 1px solid var(--line); }
  .side.vendor { background: var(--vendor-bg); }
  .side.manufacturing { background: var(--mfg-bg); }
  .side .tag {
    display: inline-block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em;
    font-weight: 700; padding: 2px 7px; border-radius: 4px; margin-bottom: 8px;
  }
  .side.vendor .tag { background: var(--vendor); color: #fff; }
  .side.manufacturing .tag { background: var(--mfg); color: #fff; }
  .side .missing { color: var(--muted); font-size: 13px; font-style: italic; }
  .side .title { font-weight: 600; font-size: 14px; margin: 0 0 10px; }
  .metrics { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px 16px; }
  .metric .label { font-size: 11px; color: var(--muted); }
  .metric .value { font-size: 15px; font-weight: 600; }
  .statusPill {
    font-size: 10px; padding: 2px 6px; border-radius: 4px; margin-left: 8px;
    background: var(--line); color: var(--ink); text-transform: uppercase;
  }
  .error { background: #fbe9e5; border: 1px solid var(--danger); color: var(--danger); padding: 12px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 20px; }
  .pendingNote { background: #fdf3e3; border: 1px solid #d9a441; color: #7a5a13; padding: 10px 12px; border-radius: 8px; font-size: 12px; margin-top: 8px; }
  .loading { color: var(--muted); font-size: 13px; }
  .empty { color: var(--muted); font-size: 13px; padding: 40px 0; text-align: center; }
  .sideTop { display: flex; gap: 12px; margin-bottom: 12px; }
  .thumb { width: 56px; height: 56px; border-radius: 6px; object-fit: cover; flex-shrink: 0; border: 1px solid var(--line); background: #fff; }
  .thumbEmpty { display: flex; align-items: center; justify-content: center; font-size: 9px; color: var(--muted); text-align: center; }
  .idLine { font-size: 11px; color: var(--muted); margin: 0; }
  .idLine a { color: inherit; text-decoration: underline; }
  .metric.wide { grid-column: span 2; }
  .pending { font-size: 11px; color: var(--muted); font-style: italic; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div>
        <h1>Style Transition Dashboard</h1>
        <p id="subhead">Vendor vs. manufacturing sales by style, paired on shared <code>style:</code> tags.</p>
      </div>
      <div class="controls">
        <div>
          <label>Start date</label>
          <input type="date" id="startDate" />
        </div>
        <div>
          <label>End date</label>
          <input type="date" id="endDate" />
        </div>
        <button class="btn" id="refreshBtn">Refresh</button>
      </div>
    </div>

    <div id="errorBox"></div>
    <div class="summary" id="summary"></div>
    <div id="pairsContainer"></div>
  </div>

  <script>
    function isoDaysAgo(n) {
      const d = new Date();
      d.setDate(d.getDate() - n);
      return d.toISOString().slice(0, 10);
    }

    function money(n) {
      return "$" + (n || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function pct(n) {
      return Math.round((n || 0) * 100) + "%";
    }

    function sellThrough(units, inventory) {
      const denom = units + Math.max(inventory, 0);
      if (denom === 0) return 0;
      return units / denom;
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    function renderSide(label, entry, sales, sessionsInfo) {
      if (!entry) {
        return (
          '<div class="side">' +
            '<span class="tag">—</span>' +
            '<p class="missing">No ' + label.toLowerCase() + ' product tagged for this style.</p>' +
          '</div>'
        );
      }

      const s = sales || { units: 0, revenue: 0, aov: 0 };
      const st = sellThrough(s.units, entry.totalInventory);
      const imageHtml = entry.image
        ? '<img src="' + escapeHtml(entry.image) + '" alt="" class="thumb" />'
        : '<div class="thumb thumbEmpty">No image</div>';

      let sessionsBlock;
      if (!sessionsInfo) {
        sessionsBlock =
          '<div class="metric"><div class="label">Sessions</div><div class="value">—</div></div>' +
          '<div class="metric"><div class="label">Conv. rate</div><div class="value">—</div></div>';
      } else if (!sessionsInfo.available) {
        sessionsBlock =
          '<div class="metric wide"><div class="label">Sessions / Conv. rate</div>' +
          '<div class="pending">Pending Shopify approval (read_reports + protected data)</div></div>';
      } else {
        const info = sessionsInfo.sessions[entry.handle];
        sessionsBlock =
          '<div class="metric"><div class="label">Sessions</div><div class="value">' + (info ? info.sessions : 0) + '</div></div>' +
          '<div class="metric"><div class="label">Conv. rate</div><div class="value">' + (info ? pct(info.conversionRate) : "0%") + '</div></div>';
      }

      return (
        '<div class="side ' + label.toLowerCase() + '">' +
          '<div class="sideTop">' +
            imageHtml +
            '<div>' +
              '<span class="tag">' + label + '</span>' +
              '<p class="title">' + escapeHtml(entry.title) +
                '<span class="statusPill">' + escapeHtml(entry.status) + '</span>' +
              '</p>' +
              '<p class="idLine">ID ' + escapeHtml(entry.numericId) +
                ' &middot; <a href="' + escapeHtml(entry.url) + '" target="_blank" rel="noopener">View</a>' +
                ' &middot; <a href="' + escapeHtml(entry.adminUrl) + '" target="_blank" rel="noopener">Edit</a>' +
              '</p>' +
            '</div>' +
          '</div>' +
          '<div class="metrics">' +
            '<div class="metric"><div class="label">Units sold</div><div class="value">' + s.units + '</div></div>' +
            '<div class="metric"><div class="label">Revenue</div><div class="value">' + money(s.revenue) + '</div></div>' +
            '<div class="metric"><div class="label">AOV</div><div class="value">' + money(s.aov) + '</div></div>' +
            '<div class="metric"><div class="label">Inventory left</div><div class="value">' + entry.totalInventory + '</div></div>' +
            '<div class="metric"><div class="label">Sell-through</div><div class="value">' + pct(st) + '</div></div>' +
            sessionsBlock +
          '</div>' +
        '</div>'
      );
    }

    async function loadEverything() {
      const startDate = document.getElementById("startDate").value;
      const endDate = document.getElementById("endDate").value;
      const refreshBtn = document.getElementById("refreshBtn");
      const errorBox = document.getElementById("errorBox");
      const summary = document.getElementById("summary");
      const pairsContainer = document.getElementById("pairsContainer");
      const subhead = document.getElementById("subhead");

      refreshBtn.disabled = true;
      refreshBtn.textContent = "Loading…";
      errorBox.innerHTML = "";
      pairsContainer.innerHTML = '<p class="loading">Loading style pairs…</p>';

      try {
        const pairsRes = await fetch("/api/pairs");
        const pairsJson = await pairsRes.json();
        if (!pairsRes.ok) throw new Error(pairsJson.error || "Failed to load products");

        const pairs = pairsJson.pairs;
        const productIds = [];
        for (const p of pairs) {
          if (p.vendor) productIds.push(p.vendor.id);
          if (p.manufacturing) productIds.push(p.manufacturing.id);
        }

        let sales = {};
        let meta = null;
        let sessionsResult = null;

        if (productIds.length > 0) {
          const salesRes = await fetch("/api/sales", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ productIds, startDate, endDate }),
          });
          const salesJson = await salesRes.json();
          if (!salesRes.ok) throw new Error(salesJson.error || "Failed to load sales");
          sales = salesJson.sales;
          meta = { ordersScanned: salesJson.ordersScanned, partial: salesJson.partial };

          const handles = [];
          for (const p of pairs) {
            if (p.vendor) handles.push(p.vendor.handle);
            if (p.manufacturing) handles.push(p.manufacturing.handle);
          }

          const sessionsRes = await fetch("/api/sessions", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ handles, startDate, endDate }),
          });
          sessionsResult = await sessionsRes.json();
        }

        // Totals
        let vUnits = 0, vRev = 0, mUnits = 0, mRev = 0;
        for (const p of pairs) {
          if (p.vendor) {
            vUnits += (sales[p.vendor.id] && sales[p.vendor.id].units) || 0;
            vRev += (sales[p.vendor.id] && sales[p.vendor.id].revenue) || 0;
          }
          if (p.manufacturing) {
            mUnits += (sales[p.manufacturing.id] && sales[p.manufacturing.id].units) || 0;
            mRev += (sales[p.manufacturing.id] && sales[p.manufacturing.id].revenue) || 0;
          }
        }

        summary.innerHTML =
          '<div class="summaryCard"><div class="label">Vendor units</div><div class="value">' + vUnits + '</div></div>' +
          '<div class="summaryCard"><div class="label">Vendor revenue</div><div class="value">' + money(vRev) + '</div></div>' +
          '<div class="summaryCard"><div class="label">Manufacturing units</div><div class="value">' + mUnits + '</div></div>' +
          '<div class="summaryCard"><div class="label">Manufacturing revenue</div><div class="value">' + money(mRev) + '</div></div>';

        if (meta && meta.ordersScanned != null) {
          subhead.innerHTML = 'Vendor vs. manufacturing sales by style, paired on shared <code>style:</code> tags. &middot; ' +
            meta.ordersScanned + ' orders scanned' + (meta.partial ? ' (partial — narrow the date range)' : '');
        }

        if (sessionsResult && !sessionsResult.available) {
          const note = document.createElement("div");
          note.className = "pendingNote";
          note.textContent = "Sessions/conversion rate not yet available: " + sessionsResult.reason;
          errorBox.appendChild(note);
        }

        if (pairs.length === 0) {
          pairsContainer.innerHTML = '<div class="empty">No paired products found. Make sure products carry both a shared ' +
            '<code>style:&lt;key&gt;</code> tag and a <code>source:vendor</code> or <code>source:manufacturing</code> tag.</div>';
        } else {
          pairsContainer.innerHTML = pairs.map(function (p) {
            return (
              '<div class="pairCard">' +
                '<div class="pairHead">' +
                  '<strong>' + escapeHtml(p.styleKey) + '</strong>' +
                  '<span class="styleKey">style:' + escapeHtml(p.styleKey) + '</span>' +
                '</div>' +
                '<div class="pairBody">' +
                  renderSide("Vendor", p.vendor, p.vendor && sales[p.vendor.id], sessionsResult) +
                  renderSide("Manufacturing", p.manufacturing, p.manufacturing && sales[p.manufacturing.id], sessionsResult) +
                '</div>' +
              '</div>'
            );
          }).join("");
        }
      } catch (err) {
        errorBox.innerHTML = '<div class="error">' + escapeHtml(err.message) + '</div>';
        pairsContainer.innerHTML = "";
      } finally {
        refreshBtn.disabled = false;
        refreshBtn.textContent = "Refresh";
      }
    }

    document.getElementById("startDate").value = isoDaysAgo(90);
    document.getElementById("endDate").value = isoDaysAgo(0);
    document.getElementById("refreshBtn").addEventListener("click", loadEverything);

    loadEverything();
  </script>
</body>
</html>
